<script>
        function switchTab(mode) {
            const loginBtn = document.getElementById('tab-login');
            const signupBtn = document.getElementById('tab-signup');
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');

            if (mode === 'login') {
                loginBtn.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                loginBtn.classList.remove('text-on-surface-variant');
                signupBtn.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                signupBtn.classList.add('text-on-surface-variant');

                loginForm.classList.remove('opacity-0', 'translate-x-full', 'pointer-events-none');
                loginForm.classList.add('opacity-100', 'translate-x-0');
                
                signupForm.classList.add('opacity-0', 'translate-x-full', 'pointer-events-none');
                signupForm.classList.remove('opacity-100', 'translate-x-0');
            } else {
                signupBtn.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                signupBtn.classList.remove('text-on-surface-variant');
                loginBtn.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                loginBtn.classList.add('text-on-surface-variant');

                signupForm.classList.remove('opacity-0', 'translate-x-full', 'pointer-events-none');
                signupForm.classList.add('opacity-100', 'translate-x-0');
                signupForm.classList.style = "position: relative";

                loginForm.classList.add('opacity-0', '-translate-x-full', 'pointer-events-none');
                loginForm.classList.remove('opacity-100', 'translate-x-0');
            }
        }

        // Ripple Effect Logic for Buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                let x = e.clientX - e.target.offsetLeft;
                let y = e.clientY - e.target.offsetTop;
                let ripple = document.createElement('span');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    </script>
<style>
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            pointer-events: none;
            border-radius: 50%;
            animation: ripple-animation 0.6s linear;
            width: 0;
            height: 0;
        }
        @keyframes ripple-animation {
            to {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }
    </style>
