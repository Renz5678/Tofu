<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center overflow-hidden">

<div class="absolute inset-0 bg-cover bg-center scale-110" data-alt="A professional, artistic close-up of a classic cloth-bound book cover featuring deep forest green textures and elegant gold-leaf typography. The lighting is moody and soft, highlighting the tactile quality of the paper and linen. This background image is heavily blurred and darkened to create a serene, atmospheric environment that doesn't distract from the user interface elements." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDr0QnMIPpHRIWGx7m-AtOwr7BgluvUCnzE-kTQ2VG86t3MlfX_BIlPPYDM1GCCcxkB1p3PlWkHjwrha0DIhSpoeu9MK1_OmqWGvj9RVPRrIAi3dt_mrPn6-nM_iJQQx0okAngBCjfkJl_uIKwh9aPb7kI2dxp0BwWWJV0XlNTbulqDyGb0JchgNWEcEJ-y2ebzUmoic84_SN4xYEI-lgsr63Ho0E9Fg9dwZPTl9fubtQ40k34T6huYdB8xHlk-zScZ6Yn_4KhDRxc')"></div>
<div class="absolute inset-0 blur-overlay bg-black/30"></div>
</div>
<!-- Active Session Content -->
<div class="relative z-10 w-full max-w-md h-screen flex flex-col items-center justify-between px-container-padding py-16 text-white">
<!-- Header Section -->
<header class="w-full text-center space-y-2">
<span class="font-label-sm text-label-sm uppercase tracking-widest opacity-60">Currently Reading</span>
<h1 class="font-title-sm text-title-sm italic">The Midnight Library</h1>
</header>
<!-- Timer Section -->
<main class="flex flex-col items-center justify-center">
<div class="font-numeric-xl text-[120px] leading-none tracking-tighter timer-glow font-bold tabular-nums" id="timer-display">
                24:42
            </div>
<div class="mt-4 flex items-center space-x-2 text-primary-fixed opacity-90">
<span class="material-symbols-outlined text-[20px]">local_fire_department</span>
<span class="font-label-lg text-label-lg">45 min daily goal</span>
</div>
</main>
<!-- Control Section -->
<footer class="w-full space-y-6">
<div class="flex flex-col gap-4">
<!-- Pause Button (Secondary Style) -->
<button class="btn-press w-full py-4 px-8 rounded-xl bg-white/10 border border-white/20 backdrop-blur-md flex items-center justify-center gap-3 transition-all" id="btn-pause">
<span class="material-symbols-outlined" id="pause-icon" style="font-variation-settings: 'FILL' 1;">pause</span>
<span class="font-label-lg text-label-lg" id="pause-text">Pause Session</span>
</button>
<!-- Finish Button (Primary Forest Green Style) -->
<button class="btn-press w-full py-4 px-8 rounded-xl bg-primary-container text-white flex items-center justify-center gap-3 shadow-xl transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-lg text-label-lg">Finish Reading</span>
</button>
</div>
<!-- Page Progress -->
<div class="space-y-3">
<div class="flex justify-between items-end">
<span class="font-label-sm text-label-sm opacity-60">Session Progress</span>
<span class="font-label-sm text-label-sm">54% of goal</span>
</div>
<div class="h-1.5 w-full bg-white/20 rounded-full overflow-hidden">
<div class="h-full bg-primary-fixed rounded-full w-[54%] transition-all duration-700 ease-out"></div>
</div>
</div>
</footer>
</div>
<!-- Floating Atmosphere Elements -->
<div class="fixed top-12 left-8 opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-4xl">auto_stories</span>
</div>
<script>
        // Simple Timer Logic
        let seconds = 1482; // 24:42
        let isPaused = false;
        const timerDisplay = document.getElementById('timer-display');
        const pauseBtn = document.getElementById('btn-pause');
        const pauseText = document.getElementById('pause-text');
        const pauseIcon = document.getElementById('pause-icon');

        function updateTimer() {
            if (isPaused) return;
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        setInterval(updateTimer, 1000);

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
                pauseText.textContent = 'Resume Reading';
                pauseIcon.textContent = 'play_arrow';
                timerDisplay.classList.add('opacity-50');
            } else {
                pauseText.textContent = 'Pause Session';
                pauseIcon.textContent = 'pause';
                timerDisplay.classList.remove('opacity-50');
            }
        });

        // Subtle parallax motion for background
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
            document.querySelector('.scale-110').style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
        });
    </script>
