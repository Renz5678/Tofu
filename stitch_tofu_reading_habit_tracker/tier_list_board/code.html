<script>
        // Micro-interaction: Drag and Drop Logic
        document.addEventListener('DOMContentLoaded', () => {
            const draggables = document.querySelectorAll('[draggable="true"]');
            const dropZones = document.querySelectorAll('.tier-drop-zone, #unsorted-tray');

            draggables.forEach(draggable => {
                draggable.addEventListener('dragstart', () => {
                    draggable.classList.add('drag-ghost');
                });

                draggable.addEventListener('dragend', () => {
                    draggable.classList.remove('drag-ghost');
                });
            });

            dropZones.forEach(zone => {
                zone.addEventListener('dragover', e => {
                    e.preventDefault();
                    zone.classList.add('bg-primary/5');
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('bg-primary/5');
                });

                zone.addEventListener('drop', e => {
                    e.preventDefault();
                    zone.classList.remove('bg-primary/5');
                    const dragging = document.querySelector('.drag-ghost');
                    if (dragging) {
                        zone.appendChild(dragging);
                        
                        // Subtle haptic-like scale effect on drop
                        dragging.classList.add('scale-110');
                        setTimeout(() => dragging.classList.remove('scale-110'), 200);
                    }
                });
            });
        });
    </script>
