<script>
        // Simple micro-interaction for chips
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                if(this.classList.contains('bg-surface-container')) {
                    this.classList.remove('bg-surface-container', 'text-on-surface-variant');
                    this.classList.add('bg-secondary-container', 'text-on-secondary-container');
                } else if (this.classList.contains('bg-secondary-container') && !this.closest('nav')) {
                    this.classList.add('bg-surface-container', 'text-on-surface-variant');
                    this.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                }
            });
        });

        // Tab switching logic
        const tabs = document.querySelectorAll('nav button');
        tabs.forEach(tab => {
            if(tab.closest('nav').classList.contains('border-b')) {
               tab.addEventListener('click', () => {
                   tabs.forEach(t => {
                       if(t.closest('nav').classList.contains('border-b')) {
                           t.classList.remove('border-primary', 'text-primary', 'font-semibold');
                           t.classList.add('text-on-surface-variant', 'opacity-60');
                           t.classList.remove('border-b-2');
                       }
                   });
                   tab.classList.add('border-primary', 'text-primary', 'font-semibold', 'border-b-2');
                   tab.classList.remove('text-on-surface-variant', 'opacity-60');
               });
            }
        });
    </script>
