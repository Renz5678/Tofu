</div>

</div>

</div>

</div>

<!-- Floating Decor -->
<div class="absolute -top-10 -right-10 w-40 h-40 bg-primary-fixed opacity-20 blur-[80px] pointer-events-none"></div>
<div class="absolute -bottom-10 -left-10 w-40 h-40 bg-secondary-fixed opacity-20 blur-[80px] pointer-events-none"></div>
<script>
        // Micro-interactions for template switching
        const templates = document.querySelectorAll('.flex-shrink-0');
        templates.forEach(t => {
            t.addEventListener('click', () => {
                templates.forEach(btn => btn.classList.remove('active-template'));
                t.classList.add('active-template');
            });
        });

        // Simple parallax effect on device orientation (simulated via mouse move for desktop)
        const card = document.getElementById('recap-card');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });
        
        // Reset card on mouse leave
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body></html>
