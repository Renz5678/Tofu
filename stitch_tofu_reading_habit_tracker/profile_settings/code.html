<script>
        // Micro-interactions and touch feedback
        document.querySelectorAll('button, a').forEach(elem => {
            elem.addEventListener('touchstart', () => {
                elem.style.transform = 'scale(0.96)';
            });
            elem.addEventListener('touchend', () => {
                elem.style.transform = 'scale(1)';
            });
        });

        // Hide navigation on scroll down for more focus, show on scroll up
        let lastScroll = 0;
        const nav = document.querySelector('nav');
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            if (currentScroll <= 0) {
                nav.classList.remove('-translate-y-full');
                return;
            }
            if (currentScroll > lastScroll && !nav.classList.contains('translate-y-full')) {
                // Scroll down
                nav.style.transform = 'translateY(100%)';
                nav.style.transition = 'transform 0.3s ease-in-out';
            } else if (currentScroll < lastScroll && nav.classList.contains('translate-y-full')) {
                // Scroll up
            }
            if (currentScroll < lastScroll) {
                nav.style.transform = 'translateY(0)';
            }
            lastScroll = currentScroll;
        });
    </script>
